# ============================================
# SonarCloud Configuration for SkillsHub
# ============================================
# Project information (defined via CLI or CI environment)
# sonar.projectKey and sonar.organization must be provided via Maven CLI:
# mvn sonar:sonar -Dsonar.projectKey=xxx -Dsonar.organization=xxx
# Source and test paths
sonar.sources=src/main/java
sonar.tests=src/test/java
sonar.java.binaries=target/classes
sonar.java.test.binaries=target/test-classes
# Encoding
sonar.sourceEncoding=UTF-8
# Java version
sonar.java.source=21
# ============================================
# JaCoCo Coverage Report
# ============================================
sonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml
# ============================================
# COVERAGE EXCLUSIONS
# ============================================
# Storage module (no tests yet - reactivate later)
# **/storage/**/*.java
# Mappers (generated by MapStruct - no need to test)
sonar.coverage.exclusions=\
    **/src/test/**,\
    **/*Test.java,\
    **/*Tests.java,\
    **/*IT.java,\
    **/*ITCase.java,\
    **/storage/**/*.java,\
    **/*Mapper.java,\
    **/*MapperImpl.java,\
    **/mapper/**/*.java
# ============================================
# COMPLETE ANALYSIS EXCLUSIONS
# (Generated files, simple POJOs)
# ============================================
sonar.exclusions=\
    **/*MapperImpl.java,\
    **/*Properties.java,\
    **/*Props.java,\
    **/SkillhubApplication.java,\
    **/*DTO.java,\
    **/*Request.java,\
    **/*Response.java,\
    **/package-info.java
# ============================================
# DUPLICATION EXCLUSIONS
# ============================================
sonar.cpd.exclusions=\
    **/entity/**/*.java,\
    **/dto/**/*.java,\
    **/model/**/*.java,\
    **/*Mapper.java
# ============================================
# QUALITY GATES THRESHOLDS
# ============================================
# These values will be checked by SonarCloud
# Uncomment if you want to define them locally
# sonar.qualitygate.wait=true
# sonar.coverage.minimum=80
# sonar.duplicated_lines_density.maximum=3
# ============================================
# ADVANCED PARAMETERS
# ============================================
# Log level
# sonar.log.level=INFO
# Analysis timeout
# sonar.ws.timeout=300
# ============================================
# REACTIVATION NOTES
# ============================================
# To reactivate the storage module in coverage:
# 1. Remove or comment the line: **/storage/**/*.java
# 2. Add tests in src/test/java/com/simplon_project/skillhub/skillhub/storage/
# 3. Run mvn clean test to generate the JaCoCo report
