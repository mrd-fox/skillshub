image: maven:3.9.9-eclipse-temurin-21  # Utilise l'image avec Java 21 et Maven 3.9.9

variables:
  DOCKER_HOST: "unix:///var/run/docker.sock"  # Utilise Docker sans DIND
  MYSQL_DATABASE: "testdb"
  MYSQL_USER: "root"
  MYSQL_PASSWORD: ""

stages:
  - build
  - test

build:
  stage: build
  script:
    - echo "Build de l'application..."
    - mvn clean package -DskipTests  # Compile sans exécuter les tests
  artifacts:
    paths:
      - target/*.jar  # Sauvegarde le JAR pour les étapes suivantes

unit_test:
  stage: test
