  #        MYSQL_DATABASE: skills-hub  # Créer une base de données à utiliser dans les tests
  #        MYSQL_USER: root  # Créer un utilisateur
  script:
    #    - echo "Attente de MariaDB..."
    #    - until mysqladmin ping -h "mariadb" --silent; do sleep 2; done  # Attendre que MariaDB soit prêt
    #    - echo "MariaDB est prête !"
    - echo "Exécution des tests..."
    - mvn test
after_script:
  - docker ps -a
