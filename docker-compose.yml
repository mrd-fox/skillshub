volumes:
  postgres-course-data:
  #  postgres-storage-data:
  postgres-user-data:
  #  minio-data:
  rabbitmq-data:
  prometheus-data:
  grafana-data:
  loki-data:

#NB to create the network by "docker network create skillshub-net" commande
networks:
  skillshub-net:
    external: true

services:
  postgres-course:
    restart: unless-stopped
    image: postgres:15
    container_name: postgres-course
    environment:
      POSTGRES_DB: ${POSTGRES_COURSE_DB:-course_service}
      POSTGRES_USER: ${POSTGRES_COURSE_USER:-root}
      POSTGRES_PASSWORD: ${POSTGRES_COURSE_PASSWORD:-root}
    ports:
      - "5433:5432"
    volumes:
      - postgres-course-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_COURSE_USER:-root} -d ${POSTGRES_COURSE_DB:-course_service}" ]
      interval: 3s
      retries: 10
    networks:
      - skillshub-net

  #  postgres-storage:
  #    restart: unless-stopped
  #    image: postgres:15
  #    container_name: postgres-storage
  #    environment:
  #      POSTGRES_DB: storage_service
  #      #todo modify credentials
  #      POSTGRES_USER: root
  #      POSTGRES_PASSWORD: root
  #    ports:
  #      - "5434:5432"
  #    volumes:
  #      - postgres-storage-data:/var/lib/postgresql/data
  #    healthcheck:
  #      test: [ "CMD-SHELL", "pg_isready -U root -d storage_service" ]
  #      interval: 3s
  #      retries: 10
  #    networks:
  #      - skillshub-net

  postgres-user:
    restart: unless-stopped
    image: postgres:15
    container_name: postgres-user
    environment:
      POSTGRES_DB: ${POSTGRES_USER_DB:-user_service}
      POSTGRES_USER: ${POSTGRES_USER_USER:-root}
      POSTGRES_PASSWORD: ${POSTGRES_USER_PASSWORD:-root}
    ports:
      - "5435:5432"
    volumes:
      - postgres-user-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER_USER:-root} -d ${POSTGRES_USER_DB:-user_service}" ]
      interval: 3s
      retries: 10
    networks:
      - skillshub-net

  #  minio:
  #    restart: unless-stopped
  #    image: minio/minio:latest
  #    container_name: minio
  #    environment:
  #      MINIO_ROOT_USER: minioadmin
  #      MINIO_ROOT_PASSWORD: minioadmin123
  #    ports:
  #      - "9000:9000" # API S3
  #      - "9001:9001" # console web
  #    volumes:
  #      - minio-data:/data
  #    command: server /data --console-address ":9001"
  #    networks:
  #      - skillshub-net

  rabbitmq:
    restart: unless-stopped
    #    build: rabbitmq
    image: rabbitmq:3.13-management
    container_name: rabbitmq
    ports:
      - "5672:5672"   # AMQP
      - "15672:15672" # Management UI
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-admin}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-admin}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      - skillshub-net

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      # ⚠️ Ce fichier doit exister dans le même dossier que ton docker-compose
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    depends_on:
      - postgres-course
      - postgres-user
      #      - postgres-storage
      - rabbitmq
    #      - minio
    networks:
      - skillshub-net

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin123}
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - skillshub-net

  loki:
    image: grafana/loki:3.0.0
    container_name: loki
    restart: unless-stopped
    ports:
      - "3100:3100"
    user: "0" # Exécute en root pour éviter les problèmes de permission
    volumes:
      - ./loki-config.yml:/etc/loki/config.yml
      - loki-data:/loki    # volume docker persistant, créé automatiquement
    command: -config.file=/etc/loki/config.yml
    networks:
      - skillshub-net

  promtail:
    image: grafana/promtail:3.0.0
    container_name: promtail
    ports:
      - "9080:9080"
    restart: unless-stopped
    volumes:
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - ./promtail-config.yml:/etc/promtail/config.yml
      - /c/Users/darde/Documents/project/skillshub/logs:/logs:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki
    networks:
      - skillshub-net

