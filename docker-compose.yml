volumes:
  postgres-data:
    driver: local
  rabbitmq-data:
    driver: local
services:
  postgres-db:
    restart: unless-stopped
    image: postgres:15
    environment:
      POSTGRES_DB: skills_hub
      POSTGRES_USER: root
      POSTGRES_PASSWORD: root
      #      - MYSQL_ROOT_PASSWORD=
      #      - MYSQL_ALLOW_EMPTY_PASSWORD=yes
      #      - MARIADB_EXTRA_FLAGS=--max-connect-errors=1000 --max-connections=1000 --log_error --log_warnings=4 --slow-query-log --log-queries-not-using-indexes --min-examined-row-limit=100
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    #      - mariabd-data:/var/lib/mysql
    container_name: postgres
    healthcheck:
      test: [ "CMD", "pg_isready", "-U", "root" ]
      interval: 3s
      retries: 10
