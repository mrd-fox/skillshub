volumes:
  postgres-course-data:
    driver: local
  postgres-storage-data:
    driver: local
  minio-data:
    driver: local
  rabbitmq-data:
    driver: local
  prometheus-data:
    driver: local
  grafana-data:
    driver: local
  loki-data:
    driver: local

networks:
  backend:
    driver: bridge
services:
  postgres-course:
    restart: unless-stopped
    image: postgres:15
    container_name: postgres-course
    environment:
      POSTGRES_DB: course_service
      POSTGRES_USER: root
      POSTGRES_PASSWORD: root
    ports:
      - "5433:5432"
    volumes:
      - postgres-course-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U root -d course_service" ]
      interval: 3s
      retries: 10

  postgres-storage:
    restart: unless-stopped
    image: postgres:15
    container_name: postgres-storage
    environment:
      POSTGRES_DB: storage_service
      POSTGRES_USER: root
      POSTGRES_PASSWORD: root
    ports:
      - "5434:5432"
    volumes:
      - postgres-storage-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U root -d storage_service" ]
      interval: 3s
      retries: 10

  minio:
    restart: unless-stopped
    image: minio/minio:latest
    container_name: minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    ports:
      - "9000:9000" # API S3
      - "9001:9001" # console web
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"

  rabbitmq:
    restart: unless-stopped
    build: rabbitmq
    image: rabbitmq:3.13-management
    container_name: rabbitmq
    ports:
      - "5672:5672"   # AMQP
      - "15672:15672" # Management UI
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      # ⚠️ Ce fichier doit exister dans le même dossier que ton docker-compose
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    depends_on:
      - postgres-course
      - postgres-storage
      - rabbitmq
      - minio
    networks:
      - backend

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - backend

  loki:
    image: grafana/loki:3.0.0
    container_name: loki
    restart: unless-stopped
    ports:
      - "3100:3100"
    user: "0" # Exécute en root pour éviter les problèmes de permission
    volumes:
      - ./loki-config.yml:/etc/loki/config.yml
      - loki-data:/loki    # volume docker persistant, créé automatiquement
    command: -config.file=/etc/loki/config.yml
    networks:
      - backend

  promtail:
    image: grafana/promtail:3.0.0
    container_name: promtail
    restart: unless-stopped
    volumes:
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - ./promtail-config.yml:/etc/promtail/config.yml
      - /c/Users/Dockerlogs:/logs:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki
    networks:
      - backend




