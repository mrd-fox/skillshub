server:
  port: ${SERVER_PORT:10020}

springdoc:
  swagger-ui:
    tagsSorter: alpha
    doc-expansion: none

spring:
  servlet:
    multipart:
      max-file-size: 1GB
      max-request-size: 1GB
      file-size-threshold: 5MB
  application:
    name: @project.artifactId@
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    course:
      url: ${SPRING_DATASOURCE_COURSE_URL:jdbc:postgresql://localhost:5433/course_service}
      username: ${SPRING_DATASOURCE_COURSE_USERNAME:root}
      password: ${SPRING_DATASOURCE_COURSE_PASSWORD:root}
    storage:
      url: ${SPRING_DATASOURCE_STORAGE_URL:jdbc:postgresql://localhost:5434/storage_service}
      username: ${SPRING_DATASOURCE_STORAGE_USERNAME:root}
      password: ${SPRING_DATASOURCE_STORAGE_PASSWORD:root}
    user:
      url: ${SPRING_DATASOURCE_USER_URL:jdbc:postgresql://localhost:5435/user_service}
      username: ${SPRING_DATASOURCE_USER_USERNAME:root}
      password: ${SPRING_DATASOURCE_USER_PASSWORD:root}
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
    hibernate:
      ddl-auto: none
  bucket: ${STORAGE_BUCKET:storage}
  prefix: ${STORAGE_PREFIX:media}
  presign-ttl-seconds: ${STORAGE_PRESIGN_TTL_SECONDS:900}

############################################################
# 📈 ACTUATOR & METRICS (Prometheus / Grafana)
############################################################
management:
  endpoints:
    web:
      exposure:
        include: prometheus,health,info, metrics
  endpoint:
    prometheus:
      access: unrestricted
  metrics:
    tags:
      application: ${spring.application.name}

rabbitmq:
  host: ${RABBITMQ_HOST:localhost}
  port: ${RABBITMQ_PORT:5672}
  username: ${RABBITMQ_USER:admin}
  password: ${RABBITMQ_PASS:admin}
  virtual-host: ${RABBITMQ_VHOST:/}
  connection-timeout: 5000
############################################################
# 📦 Storage Service
############################################################
storage:
  rabbitmq:
    exchange: ${RABBITMQ_EXCHANGE:course.events}
    upload-routing-key: ${RABBITMQ_ROUTING_KEY:course.media.uploaded.v1}
    metadata-routing-key: ${RABBITMQ_ROUTING_KEY_METADATA:course.media.metadata.extracted.v1}
    uploaded-queue: ${RABBITMQ_QUEUE_UPLOADED:course.media.uploaded.queue}
    metadata-queue: ${RABBITMQ_QUEUE_METADATA:course.media.metadata.extracted.queue}
  #    default-receive-queue: ${RABBITMQ_QUEUE:course.media.uploaded.queue}
  bucket: ${STORAGE_BUCKET:storage}
  prefix: ${STORAGE_PREFIX:media}
  presign-ttl-seconds: ${STORAGE_PRESIGN_TTL_SECONDS:900}
  tempDir: ${STORAGE_TMP_DIR:./tmp}
  worker:
    max-concurrent: ${MAX_CONCURRENT:2}
    min-free-space-mb: ${MIN_FREE_SPACE_MB:1000}
############################################################
# 📦 Course Service
############################################################
course:
  rabbitmq:
    exchange: ${RABBITMQ_EXCHANGE:course.events}
    upload-routing-key: ${RABBITMQ_ROUTING_KEY:course.media.uploaded.v1}
    metadata-routing-key: ${RABBITMQ_METADATA_ROUTING_KEY:course.media.metadata.extracted.v1}
    uploaded-queue: ${RABBITMQ_UPLOADED_QUEUE:course.media.uploaded.queue}
    metadata-queue: ${RABBITMQ_METADATA_QUEUE:course.media.metadata.extracted.queue}

    # Video polling (CONFIRM -> PROCESSING -> READY/FAILED)
    video-polling:
      enabled: true
      polling-queue: ${RABBITMQ_VIDEO_POLLING_QUEUE:course.video.polling.queue}
      polling-routing-key: ${RABBITMQ_VIDEO_POLLING_ROUTING_KEY:course.video.polling.requested}
      polling-delay-queue: ${RABBITMQ_VIDEO_POLLING_DELAY_QUEUE:course.video.polling.delay.queue}
      polling-delay-routing-key: ${RABBITMQ_VIDEO_POLLING_DELAY_ROUTING_KEY:course.video.polling.delay}
      timeout-minutes: ${RABBITMQ_VIDEO_POLLING_TIMEOUT_MINUTES:15}

    video-deletion:
      enabled: true  # Enable deletion worker
      deletion-queue: course.video.deletion.queue
      deletion-routing-key: course.video.deletion.requested
      deletion-delay-queue: course.video.deletion.delay.queue
      deletion-delay-routing-key: course.video.deletion.delay
      max-retry-attempts: 5  # Max retry before marking as FAILED
      dispatcher-fixed-delay-ms: 5000  # Outbox dispatcher polling interval (5 seconds)
      dispatcher-batch-size: 10  # Max events processed per dispatcher iteration



############################################################
# 📦 User Service
############################################################
user-service:
  base-url: http://localhost:10020
############################################################
# 📦 MinIO
############################################################
minio:
  url: ${MINIO_URL:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  secret-key: ${MINIO_SECRET_KEY:minioadmin123}
  bucket: ${MINIO_BUCKET:storage}
############################################################
# 📦 Vimeo
############################################################
vimeo:
  access-token: ${VIMEO_ACCESS_TOKEN}
  accept: application/vnd.vimeo.*+json;version=3.4
  base-url: https://api.vimeo.com

############################################################
# 📜 LOGGING CONFIGURATION
############################################################
logging:
  level:
    root: INFO
    com.simplon_project.skillhub: DEBUG
    org.springframework.amqp: INFO
    com.rabbitmq.client: INFO





