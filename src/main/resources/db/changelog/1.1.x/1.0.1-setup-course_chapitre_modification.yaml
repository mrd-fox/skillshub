databaseChangeLog:
  - changeSet:
      id: SH-129-add-chapter-to-section
      author: Marina DARDE
      changes:
        # courses.version
        - addColumn:
            tableName: courses
            columns:
              - column:
                  name: version
                  type: BIGINT
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false

        # sections.version
        - addColumn:
            tableName: sections
            columns:
              - column:
                  name: version
                  type: BIGINT
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false

        # chapters.position + chapters.version
        - addColumn:
            tableName: chapters
            columns:
              - column:
                  name: position
                  type: INTEGER
                  defaultValueNumeric: 1     # <-- adapte si besoin
                  constraints:
                    nullable: false
              - column:
                  name: version
                  type: BIGINT
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false

      rollback:
        - dropColumn:
            tableName: courses
            columnName: version
        - dropColumn:
            tableName: sections
            columnName: version
        - dropColumn:
            tableName: chapters
            columnName: position
        - dropColumn:
            tableName: chapters
            columnName: version
