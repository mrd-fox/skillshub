databaseChangeLog:
  # Add soft delete support to courses table
  - changeSet:
      id: SH-166-001-add-deleted-at-to-courses
      author: Marina DARDE
      changes:
        - addColumn:
            tableName: courses
            columns:
              - column:
                  name: deleted_at
                  type: TIMESTAMP
                  constraints:
                    nullable: true
        - createIndex:
            indexName: idx_courses_deleted_at
            tableName: courses
            columns:
              - column:
                  name: deleted_at
      rollback:
        - dropIndex:
            indexName: idx_courses_deleted_at
            tableName: courses
        - dropColumn:
            tableName: courses
            columnName: deleted_at

