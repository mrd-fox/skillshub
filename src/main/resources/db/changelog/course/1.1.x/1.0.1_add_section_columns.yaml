databaseChangeLog:
  - changeSet:
      id: SH-160-add-position-to-sections
      author: Marina DARDE
      changes:
        - addColumn:
            tableName: sections
            columns:
              - column:
                  name: position
                  type: INTEGER
                  defaultValueNumeric: 1
                  constraints:
                    nullable: false

      rollback:
        - dropColumn:
            tableName: sections
            columnName: position