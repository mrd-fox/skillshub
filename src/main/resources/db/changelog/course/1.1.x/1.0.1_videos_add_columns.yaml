databaseChangeLog:
  - changeSet:
      id: SH-160-videos-add-source-uri-thumbnail-error
      author: Marina DARDE
      changes:

        - addColumn:
            tableName: videos
            columns:
              - column:
                  name: source_uri
                  type: VARCHAR(512)
              - column:
                  name: thumbnail_url
                  type: TEXT
              - column:
                  name: error_message
                  type: TEXT

        # Backfill for existing MinIO rows
        # We store a canonical URI to avoid provider coupling.
        - sql:
            dbms: postgres
            splitStatements: false
            stripComments: true
            sql: |
              UPDATE videos
              SET source_uri = 's3://storage/' || storage_key
              WHERE source_uri IS NULL
                AND storage_key IS NOT NULL
                AND storage_key <> '';

        # If you have legacy rows with no storage_key, you must decide a policy.
        # Here we fail the migration if source_uri is still null after backfill.
        - addNotNullConstraint:
            tableName: videos
            columnName: source_uri
            columnDataType: VARCHAR(512)

        - addUniqueConstraint:
            tableName: videos
            columnNames: source_uri
            constraintName: uk__videos__source_uri

      rollback:
        - dropUniqueConstraint:
            tableName: videos
            constraintName: uk__videos__source_uri
        - dropNotNullConstraint:
            tableName: videos
            columnName: source_uri
            columnDataType: VARCHAR(512)
        - dropColumn:
            tableName: videos
            columnName: error_message
        - dropColumn:
            tableName: videos
            columnName: thumbnail_url
        - dropColumn:
            tableName: videos
            columnName: source_uri
