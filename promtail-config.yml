server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push
    tenant_id: "fake"

scrape_configs:
  - job_name: spring
    static_configs:
      - targets:
          - localhost
        labels:
          job: "spring"
          app: "skillshub"
          environment: "local"
          __path__: /logs/*.log
